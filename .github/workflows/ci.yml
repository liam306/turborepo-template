name: CI
run-name: ${{ github.actor }} is validating (${{ github.ref_name }})

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Environment
        run: cp .env.example .env

      - name: Code Formatting Check
        run: pnpm format:check

      - name: Scanner Scripts Lint & Typecheck
        run: pnpm lint:scripts && pnpm typecheck:scripts

      - name: Scanner Unit Tests
        run: pnpm test:scripts

      - name: i18n Consistency Check
        run: pnpm check:i18n

      - name: Generate Hardcoded Text Audit Report
        run: node scripts/check-hardcoded-text.mjs --format json > hardcoded-audit-report.json || true

      - name: Upload Hardcoded Text Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardcoded-audit-report
          path: hardcoded-audit-report.json
          if-no-files-found: ignore

      - name: Hardcoded Text Audit
        run: pnpm check:hardcoded

      - name: Architecture & Codebase Rules Check
        run: pnpm check:rules

      - name: Renovate Configuration Check
        run: pnpm check:renovate

      - name: Expo SDK Compatibility Audit
        run: pnpm check:expo

      - name: Lint All Workspaces
        run: pnpm lint

      - name: Typecheck All Workspaces
        run: pnpm typecheck

      - name: Run All Tests
        run: pnpm test

      - name: Build All Workspaces
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run Web E2E Tests
        run: pnpm test:e2e:web

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    name: Integration & Native Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgrespassword@localhost:5432/app_test_db" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Run API & Database Integration Tests
        run: pnpm test:integration

      - name: Mobile Bundle Export Smoke Check
        run: pnpm bundle:check:mobile
