name: ${APP_NAME:-starter}-web-${ENV_TYPE:-prod}

services:
  web:
    image: ${APP_NAME:-starter}-web:${ENV_TYPE:-prod}
    container_name: ${APP_NAME:-starter}-web-${ENV_TYPE:-prod}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.web
        required: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    networks:
      - repo_network

networks:
  repo_network:
    name: ${APP_NAME:-starter}_network
    external: true
