name: Deploy Services to VPS
concurrency:
  group: vps-production
  cancel-in-progress: false
run-name: ${{ github.actor }} is deploying Services to VPS (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'docker-compose.api.yml'
      - 'docker-compose.web.yml'
      - 'docker-compose.infra.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target service to deploy'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - api
          - web
      skip_build:
        description: 'Skip the build stage'
        required: false
        type: boolean
        default: false
      skip_migrate:
        description: 'Skip API database migration'
        required: false
        type: boolean
        default: false

env:
  APP_NAME: ${{ vars.APP_NAME || 'starter' }}
  ENV_TYPE: prod

jobs:
  detect:
    if: vars.ENABLE_VPS_DEPLOY == 'true'
    name: Detect Changes
    runs-on: self-hosted
    outputs:
      api: ${{ steps.targets.outputs.api }}
      web: ${{ steps.targets.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Filter changed paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'docker-compose.api.yml'
              - 'docker-compose.infra.yml'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'docker-compose.web.yml'
              - '.github/workflows/deploy.yml'

      - name: Set target flags
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            echo "api=$([ "$TARGET" = "all" ] || [ "$TARGET" = "api" ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
            echo "web=$([ "$TARGET" = "all" ] || [ "$TARGET" = "web" ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Sentry Configuration for Production Delivery
        if: env.ENV_TYPE == 'prod'
        env:
          ENV_API: ${{ secrets.ENV_API_PROD }}
          ENV_WEB: ${{ secrets.ENV_WEB_PROD }}
          SENTRY_ORG_FALLBACK: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB_FALLBACK: ${{ vars.SENTRY_PROJECT_WEB || vars.SENTRY_PROJECT }}
          SENTRY_PROJECT_API_FALLBACK: ${{ vars.SENTRY_PROJECT_API }}
          SENTRY_AUTH_TOKEN_WEB_FALLBACK: ${{ secrets.SENTRY_AUTH_TOKEN_WEB || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_AUTH_TOKEN_API_FALLBACK: ${{ secrets.SENTRY_AUTH_TOKEN_API || secrets.SENTRY_AUTH_TOKEN }}
          TARGET_API: ${{ steps.targets.outputs.api }}
          TARGET_WEB: ${{ steps.targets.outputs.web }}
        run: |
          echo "Checking Sentry configuration for production release (graceful check)..."

          check_sentry() {
            local env_data="$1"
            local name="$2"
            local fallback_org="$3"
            local fallback_proj="$4"
            local fallback_token="$5"

            local org=$(echo "$env_data" | grep -E '^SENTRY_ORG=' | cut -d= -f2- | tr -d '"'\'' ')
            [ -z "$org" ] && org="$fallback_org"

            local proj=$(echo "$env_data" | grep -E '^SENTRY_PROJECT=' | cut -d= -f2- | tr -d '"'\'' ')
            [ -z "$proj" ] && proj="$fallback_proj"

            local token=$(echo "$env_data" | grep -E '^SENTRY_AUTH_TOKEN=' | cut -d= -f2- | tr -d '"'\'' ')
            [ -z "$token" ] && token="$fallback_token"

            if [ -n "$org" ] && [ -n "$proj" ] && [ -n "$token" ]; then
              echo "Notice: $name Sentry configured (org: $org, project: $proj). Source maps upload will be executed."
            else
              echo "::notice::$name Sentry configuration incomplete or omitted. Build will gracefully skip Sentry source maps upload."
            fi
          }

          if [ "$TARGET_WEB" = "true" ]; then
            check_sentry "$ENV_WEB" "Web" "$SENTRY_ORG_FALLBACK" "$SENTRY_PROJECT_WEB_FALLBACK" "$SENTRY_AUTH_TOKEN_WEB_FALLBACK"
          fi

          if [ "$TARGET_API" = "true" ]; then
            check_sentry "$ENV_API" "API" "$SENTRY_ORG_FALLBACK" "$SENTRY_PROJECT_API_FALLBACK" "$SENTRY_AUTH_TOKEN_API_FALLBACK"
          fi

          echo "Notice: Mobile Sentry builds will gracefully skip Sentry plugin until configured."
          echo "Sentry configuration check completed."

  build-api:
    name: Build API Docker Image
    runs-on: self-hosted
    needs: detect
    if: |
      needs.detect.outputs.api == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_build != true)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ env.APP_NAME }}-builder
          keep-state: true
          cleanup: false

      - name: Build Docker Runner Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          load: true
          tags: ${{ env.APP_NAME }}-api:${{ env.ENV_TYPE }}

      - name: Export API Source Maps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: sourcemaps
          outputs: type=local,dest=./apps/api/.sourcemaps

      - name: Upload API Source Maps to Sentry
        env:
          ENV_API: ${{ secrets.ENV_API_PROD }}
          SENTRY_AUTH_TOKEN_FALLBACK: ${{ secrets.SENTRY_AUTH_TOKEN_API || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_FALLBACK: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_FALLBACK: ${{ vars.SENTRY_PROJECT_API }}
          SENTRY_RELEASE: api@${{ github.sha }}
        run: |
          SENTRY_ORG=$(echo "$ENV_API" | grep -E '^SENTRY_ORG=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_ORG" ] && SENTRY_ORG="$SENTRY_ORG_FALLBACK"

          SENTRY_PROJECT=$(echo "$ENV_API" | grep -E '^SENTRY_PROJECT=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_PROJECT" ] && SENTRY_PROJECT="$SENTRY_PROJECT_FALLBACK"

          SENTRY_AUTH_TOKEN=$(echo "$ENV_API" | grep -E '^SENTRY_AUTH_TOKEN=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_AUTH_TOKEN" ] && SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN_FALLBACK"

          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "Uploading API source maps to Sentry for release $SENTRY_RELEASE..."
            docker run --rm \
              -v "$(pwd)/apps/api/.sourcemaps:/sourcemaps" \
              -e SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" \
              getsentry/sentry-cli:2.58.4 \
              sourcemaps upload /sourcemaps \
                --org "$SENTRY_ORG" \
                --project "$SENTRY_PROJECT" \
                --release "$SENTRY_RELEASE"
          else
            echo "::notice::Skipping API source maps upload: Sentry credentials or project configuration missing in ENV_API_PROD."
          fi

      - name: Clean up API Source Maps artifact
        if: always()
        run: |
          rm -rf ./apps/api/.sourcemaps

  deploy-api:
    name: Deploy API to VPS
    runs-on: self-hosted
    needs: [detect, build-api]
    if: |
      always() &&
      needs.detect.outputs.api == 'true' &&
      (needs.build-api.result == 'success' || (needs.build-api.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_build == true))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate image availability when build was skipped
        if: github.event_name == 'workflow_dispatch' && inputs.skip_build == true
        run: |
          if ! docker image inspect "${APP_NAME}-api:${{ env.ENV_TYPE }}" >/dev/null 2>&1; then
            echo "Error: Image ${APP_NAME}-api:${{ env.ENV_TYPE }} not found on host. Cannot skip build."
            exit 1
          fi

      - name: Write environment file and ensure infrastructure
        env:
          ENV_API: ${{ secrets.ENV_API_PROD }}
        run: |
          echo "$ENV_API" > .env.api
          echo "ENV_TYPE=$ENV_TYPE" >> .env.api
          echo "APP_NAME=$APP_NAME" >> .env.api

          # Preserve original image release when skip_build is true
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_build == true }}" = "true" ]; then
            EXISTING_RELEASE=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "${APP_NAME}-api-${ENV_TYPE}" 2>/dev/null | grep '^SENTRY_RELEASE=' | cut -d= -f2- || true)
            if [ -n "$EXISTING_RELEASE" ]; then
              echo "Preserving existing API Sentry release: $EXISTING_RELEASE"
              echo "SENTRY_RELEASE=$EXISTING_RELEASE" >> .env.api
            fi
          else
            echo "SENTRY_RELEASE=api@${{ github.sha }}" >> .env.api
          fi

          # Ensure required external Docker networks exist
          docker network inspect "${APP_NAME}_network" >/dev/null 2>&1 || docker network create "${APP_NAME}_network"

          # Auto-heal: Ensure DB container is running
          if ! docker ps -q --filter "name=^${APP_NAME}-postgres-${ENV_TYPE}$" | grep -q .; then
            echo "Database container is not running. Starting infrastructure services..."
            docker compose --env-file .env.api -f docker-compose.infra.yml up -d
          fi

      - name: Run database migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_migrate != true }}
        run: |
          set -a
          [ -f .env.api ] && . ./.env.api
          set +a

          echo "Waiting for PostgreSQL database to start..."
          for i in {1..30}; do
            if docker exec "${APP_NAME}-postgres-${ENV_TYPE}" pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-app_db}" >/dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database to accept connections... ($i/30)"
            sleep 1
          done

          # Run Drizzle migrations via runner container (runs concurrently with active API for zero downtime)
          echo "Running database migrations..."
          docker run --rm \
            --network "${APP_NAME}_network" \
            -e DATABASE_URL="postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${APP_NAME}-postgres-${ENV_TYPE}:5432/${POSTGRES_DB:-app_db}" \
            "${APP_NAME}-api:$ENV_TYPE" \
            node scripts/migrate.mjs

      - name: Start API application
        run: |
          echo "Starting NestJS application..."
          docker compose --env-file .env.api -f docker-compose.api.yml up -d --remove-orphans api

      - name: Verify API Health
        run: |
          echo "Waiting for API to become ready..."
          for i in {1..20}; do
            if docker exec "${APP_NAME}-api-${ENV_TYPE}" curl -sf http://localhost:4000/v1/health/ready | grep -q '"status":"ok"'; then
              echo "API is healthy and serving traffic!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "API failed healthcheck!"
              docker logs --tail 100 "${APP_NAME}-api-${ENV_TYPE}"
              exit 1
            fi
            echo "Waiting for API startup... ($i/20)"
            sleep 2
          done

      - name: Clean up temporary images
        run: |
          # Clean up dangling images to free VPS disk space
          docker image prune -f

  build-web:
    name: Build Web Docker Image
    runs-on: self-hosted
    needs: [detect, deploy-api]
    if: |
      always() &&
      needs.detect.outputs.web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.detect.outputs.api == 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_build != true)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ env.APP_NAME }}-builder
          keep-state: true
          cleanup: false

      - name: Prepare Web Build Arguments
        id: args
        env:
          ENV_WEB: ${{ secrets.ENV_WEB_PROD }}
          SENTRY_ORG_FALLBACK: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_FALLBACK: ${{ vars.SENTRY_PROJECT_WEB || vars.SENTRY_PROJECT }}
        run: |
          SENTRY_ORG=$(echo "$ENV_WEB" | grep -E '^SENTRY_ORG=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_ORG" ] && SENTRY_ORG="$SENTRY_ORG_FALLBACK"

          SENTRY_PROJECT=$(echo "$ENV_WEB" | grep -E '^SENTRY_PROJECT=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_PROJECT" ] && SENTRY_PROJECT="$SENTRY_PROJECT_FALLBACK"

          {
            echo "build_args<<EOF"
            # Strip auth token and duplicate sentry keys from build args so credentials are never baked into image layers
            echo "$ENV_WEB" | grep -E '^[A-Za-z0-9_]+=' | grep -v '^SENTRY_AUTH_TOKEN=' | grep -v '^SENTRY_ORG=' | grep -v '^SENTRY_PROJECT=' || true
            echo "SENTRY_RELEASE=web@${{ github.sha }}"
            echo "NEXT_PUBLIC_SENTRY_RELEASE=web@${{ github.sha }}"
            echo "SENTRY_ORG=$SENTRY_ORG"
            echo "SENTRY_PROJECT=$SENTRY_PROJECT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          load: true
          tags: ${{ env.APP_NAME }}-web:${{ env.ENV_TYPE }}
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Export Web Source Maps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: sourcemaps
          outputs: type=local,dest=./apps/web/.sourcemaps
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Upload Web Source Maps to Sentry
        env:
          ENV_WEB: ${{ secrets.ENV_WEB_PROD }}
          SENTRY_AUTH_TOKEN_FALLBACK: ${{ secrets.SENTRY_AUTH_TOKEN_WEB || secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_FALLBACK: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_FALLBACK: ${{ vars.SENTRY_PROJECT_WEB || vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: web@${{ github.sha }}
        run: |
          SENTRY_ORG=$(echo "$ENV_WEB" | grep -E '^SENTRY_ORG=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_ORG" ] && SENTRY_ORG="$SENTRY_ORG_FALLBACK"

          SENTRY_PROJECT=$(echo "$ENV_WEB" | grep -E '^SENTRY_PROJECT=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_PROJECT" ] && SENTRY_PROJECT="$SENTRY_PROJECT_FALLBACK"

          SENTRY_AUTH_TOKEN=$(echo "$ENV_WEB" | grep -E '^SENTRY_AUTH_TOKEN=' | cut -d= -f2- | tr -d '"'\'' ')
          [ -z "$SENTRY_AUTH_TOKEN" ] && SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN_FALLBACK"

          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "Uploading Web source maps to Sentry for release $SENTRY_RELEASE..."
            docker run --rm \
              -v "$(pwd)/apps/web/.sourcemaps:/sourcemaps" \
              -e SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN" \
              getsentry/sentry-cli:2.58.4 \
              sourcemaps upload /sourcemaps \
                --org "$SENTRY_ORG" \
                --project "$SENTRY_PROJECT" \
                --release "$SENTRY_RELEASE" \
                --ignore node_modules
          else
            echo "::notice::Skipping Web source maps upload: Sentry credentials or project configuration missing in ENV_WEB_PROD."
          fi

      - name: Clean up Web Source Maps artifact
        if: always()
        run: |
          rm -rf ./apps/web/.sourcemaps

  deploy-web:
    name: Deploy Web to VPS
    runs-on: self-hosted
    needs: [detect, build-web, deploy-api]
    if: |
      always() &&
      needs.detect.outputs.web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.detect.outputs.api == 'false') &&
      (needs.build-web.result == 'success' || (needs.build-web.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_build == true))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate image availability when build was skipped
        if: github.event_name == 'workflow_dispatch' && inputs.skip_build == true
        run: |
          if ! docker image inspect "${APP_NAME}-web:${{ env.ENV_TYPE }}" >/dev/null 2>&1; then
            echo "Error: Image ${APP_NAME}-web:${{ env.ENV_TYPE }} not found on host. Cannot skip build."
            exit 1
          fi

      - name: Create environment files and ensure networks
        env:
          ENV_WEB: ${{ secrets.ENV_WEB_PROD }}
        run: |
          echo "$ENV_WEB" > .env.web
          echo "ENV_TYPE=$ENV_TYPE" >> .env.web
          echo "APP_NAME=$APP_NAME" >> .env.web

          # Preserve original image release when skip_build is true
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.skip_build == true }}" = "true" ]; then
            EXISTING_RELEASE=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "${APP_NAME}-web-${ENV_TYPE}" 2>/dev/null | grep '^SENTRY_RELEASE=' | cut -d= -f2- || true)
            if [ -n "$EXISTING_RELEASE" ]; then
              echo "Preserving existing Web Sentry release: $EXISTING_RELEASE"
              echo "SENTRY_RELEASE=$EXISTING_RELEASE" >> .env.web
            fi
          else
            echo "SENTRY_RELEASE=web@${{ github.sha }}" >> .env.web
          fi

          # Ensure required external Docker networks exist
          docker network inspect "${APP_NAME}_network" >/dev/null 2>&1 || docker network create "${APP_NAME}_network"

      - name: Run Docker Compose
        run: |
          docker compose --env-file .env.web -f docker-compose.web.yml up -d --remove-orphans web

      - name: Verify Web Health
        run: |
          echo "Waiting for Web service to become ready..."
          for i in {1..20}; do
            if docker exec "${APP_NAME}-web-${ENV_TYPE}" curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "Web service is healthy!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Web service failed healthcheck!"
              docker logs --tail 100 "${APP_NAME}-web-${ENV_TYPE}"
              exit 1
            fi
            echo "Waiting for Web startup... ($i/20)"
            sleep 2
          done

      - name: Clean up dangling images
        run: |
          docker image prune -f
